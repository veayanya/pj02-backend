services:
  - type: web
    name: ilovepdf-clone-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ILOVEPDF_PUBLIC_KEY
        sync: false
      - key: ILOVEPDF_SECRET_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "50"
